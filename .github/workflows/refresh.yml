name: Refresh job matches

on:
  schedule:
    - cron: "0 12 * * *"   # ~6 am Chicago (7 am in summer); GitHub may start scheduled runs a little late
    - cron: "0 19 * * *"   # ~1 pm Chicago
  workflow_dispatch: {}    # "Run workflow" button in the Actions tab
  push:                    # rebuild right away when the code, scoring or employer list changes
    branches: [main]
    paths: ["**.py", "**.json", "web/**", ".github/workflows/**"]

permissions:
  contents: write          # only for the occasional keep-active commit
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      TZ: America/Chicago   # timestamps and "posted today" in Chicago time
      ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
      ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
      USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
      USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Job history (first-seen dates, cached descriptions) carried from run to run.
      - name: Restore job history
        uses: actions/cache/restore@v4
        with:
          path: state
          key: jobs-db-${{ github.run_id }}
          restore-keys: jobs-db-

      - name: Fetch and score jobs
        run: python server.py --fetch-once --db state/jobs.db

      - name: Save job history
        if: always() && hashFiles('state/jobs.db') != ''
        uses: actions/cache/save@v4
        with:
          path: state
          key: jobs-db-${{ github.run_id }}

      - name: Build the website
        run: python build_static.py --db state/jobs.db --out _site

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publish to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      # GitHub pauses schedules in public repos after 60 days without commits.
      - name: Keep the schedule active
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep daily refresh active"
            git push
          fi
